[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caly360-backend"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
