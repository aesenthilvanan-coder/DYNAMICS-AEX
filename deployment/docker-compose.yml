services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caly360
      POSTGRES_USER: caly360
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caly360"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://caly360:password@db:5432/caly360
      - ENABLE_DATABASE=true
      - ENABLE_METRICS=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOCAL_UPLOAD_ROOT=/tmp/caly360_uploads
      - DYNAMICS_OUTPUT_ROOT=/tmp/caly360_md
    volumes:
      - ./data:/app/data
      - /tmp/caly360_md:/tmp/caly360_md
      - /tmp/caly360_uploads:/tmp/caly360_uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_dynamics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker -Q dynamics -c 2 -l info
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://caly360:password@db:5432/caly360
      - ENABLE_DATABASE=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOCAL_UPLOAD_ROOT=/tmp/caly360_uploads
      - DYNAMICS_OUTPUT_ROOT=/tmp/caly360_md
    volumes:
      - /tmp/caly360_md:/tmp/caly360_md
      - /tmp/caly360_uploads:/tmp/caly360_uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
